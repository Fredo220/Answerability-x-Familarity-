name: FA Source-v6 quality

on:
  pull_request:
  push:
    branches:
      - codex/fa-source-v6-development

jobs:
  source-v6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test,quality]"
      - run: ruff check src/trajectory_extractor/fa_development_*.py tests/test_fa_development_*.py
      - run: pyright
      - run: >-
          pytest -q
          tests/test_fa_development_source.py
          tests/test_fa_development_frame.py
          tests/test_fa_development_screening.py
          tests/test_fa_entities.py
          tests/test_fa_confirmatory_source.py
          tests/test_fa_confirmatory_synthetics.py
