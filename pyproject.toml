[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-extractor"
version = "0.1.0"
description = "Leakage-resistant Familiarity vs. Answerability study for language models."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2",
    "transformers>=4.43",
    "accelerate>=0.33",
    "certifi",
    "numpy>=1.26",
    "matplotlib",
    "pandas",
    "scikit-learn",
    "ipykernel",
]

[project.optional-dependencies]
test = ["pytest", "jsonschema>=4.23,<5"]
quality = ["pyright>=1.1.400,<2", "ruff>=0.12,<1"]
rlmf-local = ["peft==0.18.0", "safetensors>=0.5,<1"]

[project.scripts]
feature-dynamics = "trajectory_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
include = [
    "src/trajectory_extractor/fa_development_source.py",
    "src/trajectory_extractor/fa_development_frame.py",
    "src/trajectory_extractor/fa_development_screening.py",
]
